name: Lakshay CI Pipeline

on:
  # Run automatically when code is pushed to main
  push:
    branches:
      - main

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

jobs:

  # =========================================================
  # LAKSHAY - Backend Tests
  # =========================================================
  backend-test:
    name: Lakshay Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    # ---------------------------------------------------------
    # PostgreSQL service used for backend tests
    # ---------------------------------------------------------
    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # ---------------------------------------------------------
    # Environment variables required by backend services
    # ---------------------------------------------------------
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-lakshay-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: lakshay-admin
      DEFAULT_ADMIN_EMAIL: lakshay-admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: LakshayAdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      # Node 24 compatible checkout action
      - name: Lakshay Checkout repository
        uses: actions/checkout@v6

      # Node 24 compatible setup-python action
      - name: Lakshay Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lakshay Upgrade pip
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip

      - name: Lakshay Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          pip install -r requirements.txt

      - name: Lakshay Run backend tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # LAKSHAY - Build and Push Docker Images
  # =========================================================
  build_and_push_images:
    name: Lakshay Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # CRITICAL:
    # Docker images will only be built if ALL backend tests succeed
    needs:
      - backend-test

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: lakshay-koalatech-frontend

          - service: user-service
            image: lakshay-koalatech-user-service

          - service: student-service
            image: lakshay-koalatech-student-service

          - service: lecturer-service
            image: lakshay-koalatech-lecturer-service

          - service: course-service
            image: lakshay-koalatech-course-service

          - service: enrollment-service
            image: lakshay-koalatech-enrollment-service

    steps:

      # Node 24 compatible checkout
      - name: Lakshay Checkout repository
        uses: actions/checkout@v6

      # Azure Login v3 uses the newer Node runtime
      - name: Lakshay Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Lakshay Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Lakshay Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }} \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest \
            ./${{ matrix.service }}

      - name: Lakshay Push Docker image with commit SHA
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

      - name: Lakshay Push Docker image with latest tag
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest

      - name: Lakshay Verify pushed repository
        run: |
          echo "Successfully pushed:"
          echo "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}"
          echo "${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest"